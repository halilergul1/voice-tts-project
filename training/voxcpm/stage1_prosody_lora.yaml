# Stage 1 "prosody" LoRA on VoxCPM2: upstream conf/voxcpm_v2/voxcpm_finetune_lora.yaml with the plan's settings
# (docs/superpowers/plans/2026-10-26-voxcpm2-stage01.md, Task 6). Run 4: one epoch of data/voxcpm_v4, clean clips only
# (make_voxcpm_manifest.py --restored-only, Sidon-restored FLEURS replay; 42,050 train rows):
# num_iters = max_steps = ceil(42050 / 16) = 2629. Run 1 (stage1/) trained on partly separated audio, run 2 (stage1_v2/)
# on fully separated audio, run 3 (stage1_v3/, 2626 steps, data/voxcpm) on Sidon audio including fallback clips.
pretrained_path: /home/ibrahim/tts/models/VoxCPM2
train_manifest: /home/ibrahim/voice-data/data/voxcpm_v4/train.jsonl
val_manifest: /home/ibrahim/voice-data/data/voxcpm_v4/val.jsonl
sample_rate: 16000        # AudioVAE encoder input rate; must match audio_vae_config.sample_rate
out_sample_rate: 48000    # AudioVAE decoder output rate; used for TensorBoard audio logging
batch_size: 4
grad_accum_steps: 4  # batch 16 and 8 ran out of memory on the 32 GB 5090 (rows up to 20 s + a reference clip); effective batch stays 16
num_workers: 4
preprocessing_num_workers: 8
num_iters: 2629
log_interval: 10
valid_interval: 250
save_interval: 250
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 100
max_steps: 2629
max_batch_tokens: 8192
max_grad_norm: 1.0
save_path: /home/ibrahim/tts/checkpoints/stage1_v4
tensorboard: /home/ibrahim/tts/logs/stage1_v4
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 64
  alpha: 64
  dropout: 0.0
