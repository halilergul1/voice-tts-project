[project]
name = "ttsdata"
version = "0.1.0"
description = "Build Turkish TTS training data from accessible (Engelsiz) TV broadcasts: TRT via YouTube, Kanal D via CDN"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp>=2026.10.21",
  "mlx-whisper>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch>=2.4",
  "silero-vad>=5.1",
  "soundfile>=0.12",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "num2words>=0.5.13",
  "pyloudnorm>=0.1.1",
  "jiwer>=3.0",
  "tqdm>=4.66",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
cuda = ["faster-whisper>=1.1"]   # Linux / NVIDIA: pip install -e ".[cuda]"
speakers = ["speechbrain>=1.0"]  # ttsdata speakers: ECAPA-TDNN speaker embeddings (CPU / MPS / CUDA)
events = ["panns-inference>=0.1.1"]  # ttsdata verify-events: AudioSet tagger (laughter, crying, speech) on event clips
emotions = ["funasr>=1.2", "modelscope>=1.20"]  # ttsdata emotions: emotion2vec+ large (EmpathicInsight needs transformers)

[project.scripts]
ttsdata = "ttsdata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ttsdata"]
